<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Dig Clash</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
      }

      #unity-container {
        position: fixed;
        inset: 0;
      }

      #unity-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #unity-warning {
        position: fixed;
        left: 50%;
        top: 16px;
        transform: translateX(-50%);
        z-index: 1000;
      }
    </style>
      <style id="digwar-inline-hide-loading">
      html, body {
        width: 100%;
        height: 100%;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        background: #111;
      }
      #unity-container.unity-desktop {
        position: fixed !important;
        left: 0 !important;
        top: 0 !important;
        transform: none !important;
        width: 100vw !important;
        height: 100vh !important;
      }
      #unity-canvas {
        display: block !important;
        width: 100vw !important;
        height: 100vh !important;
      }
      #unity-loading-bar,
      #unity-logo,
      #unity-progress-bar-empty,
      #unity-progress-bar-full,
      #unity-footer,
      #unity-webgl-logo,
      #unity-build-title,
      #unity-fullscreen-button {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-warning"></div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var warningBanner = document.querySelector("#unity-warning");
      var footer = document.querySelector("#unity-footer");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        div.style = "padding: 10px; margin: 4px; border-radius: 6px;";
        if (type === "error") {
          div.style += "background: rgba(180, 0, 0, 0.9); color: #fff;";
        } else {
          div.style += "background: rgba(255, 214, 10, 0.9); color: #111;";
          setTimeout(function() {
            if (div.parentNode === warningBanner) {
              warningBanner.removeChild(div);
            }
            updateBannerVisibility();
          }, 5000);
        }
        warningBanner.appendChild(div);
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebGL.data",
        frameworkUrl: buildUrl + "/WebGL.framework.js",
        codeUrl: buildUrl + "/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "gargang2a",
        productName: "DigWar",
        productVersion: "1.0",
        showBanner: unityShowBanner
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content =
          "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function() {
        createUnityInstance(canvas, config)
          .catch(function(message) {
            alert(message);
          });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
